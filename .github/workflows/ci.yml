name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Evals (fixture format gates)
        run: bun run eval
        env:
          # Deterministic mock model — no OpenCode key required in CI.
          CURL_EVAL_MOCK: "1"

      - name: Upload eval artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eve-evals
          path: .eve/evals/
          if-no-files-found: ignore
